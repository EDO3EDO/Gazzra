@for (item of showCart(); track $index) {
    <main class="notification-card bg-white rounded-4 p-4 position-relative" data-purpose="cart-toast-modal">
        <header class="d-flex align-items-center justify-content-between pb-3" data-purpose="card-header">
            <div class="d-flex align-items-center gap-2">
                <!-- Success checkmark icon pill -->
                <span aria-hidden="true" class="success-pill rounded-circle d-flex align-items-center justify-content-center">
                    <span class="material-icons fs-6">check</span>
                </span>
                <!-- Added status label -->
                <span class="status-label">
                    ADDED TO CART
                </span>
            </div>
            <!-- Close icon button -->
            <button aria-label="Close notification" class="btn-close-custom p-1 border-0 bg-transparent text-secondary" type="button" id="closeNotification">
                <span class="material-icons fs-5">close</span>
            </button>
        </header>

        <section class="d-flex gap-3 py-1 align-items-start" data-purpose="product-info">
            <div class="product-img-container rounded-3 overflow-hidden bg-light flex-shrink-0">
                <img [alt]="item.title" class="w-100 h-100 object-fit-cover" [src]="item.coverImage" />
            </div>
            <div class="d-flex flex-column justify-content-center min-w-0 pe-1 pt-1">
                <h2 class="product-title text-truncate">{{ item.title }}</h2>
                <p class="product-subtitle mb-1">
                    {{ item.category }} · Qty: {{ item.quantity }}
                </p>
                <p class="product-price mb-0">{{ item.price }} EGP</p>
            </div>
        </section>

        <div class="mt-3 promo-banner rounded-2 px-3 py-2 d-flex align-items-center gap-2" data-purpose="free-shipping-indicator">
            <span class="material-icons text-success fs-5 flex-shrink-0">local_shipping</span>
            <p class="promo-text mb-0">
                <strong class="fw-semibold text-success">Free shipping</strong> applied to this order
            </p>
        </div>

        <footer class="mt-3 pt-1 row g-2" data-purpose="cart-actions">
            <div class="col-6">
                <!-- زرار عرض السلة -->
                <a class="btn-custom-outline w-100 d-flex align-items-center justify-content-center text-decoration-none" href="#view-bag">View Bag</a>
            </div>
            <div class="col-6">
                <a class="btn-custom-solid w-100 d-flex align-items-center justify-content-center gap-1 text-decoration-none text-white" href="#checkout">
                    <span>CHECKOUT</span>
                    <span class="material-icons fs-6">arrow_forward</span>
                </a>
            </div>
        </footer>
    </main>
}
